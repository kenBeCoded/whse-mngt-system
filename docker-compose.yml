services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web
    ports:
      - "5175:5175"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3002
      - CUSTOM_WEB_VAR=your_custom_value_here
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
    command: npm run dev -- --host 0.0.0.0 --port 5175

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "3002:3002"
    # env_file:
    #   - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3002
      - FRONTEND_URL=http://localhost:5175
      - USERS_DB=postgres://postgres:111599@db:5432/users
      - JWT_SECRET=test
      - ACCESS_TOKEN_SECRET=test
      - REFRESH_TOKEN_SECRET=test
      # - POSTGRES_USER=postgres
      # - POSTGRES_PASSWORD=111599
      # - POSTGRES_DB=users
      # - CUSTOM_API_VAR=your_custom_value_here
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json
    command: npm run dev

  db:
    image: postgres:16-alpine
    container_name: db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=111599
      - POSTGRES_DB=users
      # - CUSTOM_DB_VAR=your_custom_value_here
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/sql/create-sql.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
