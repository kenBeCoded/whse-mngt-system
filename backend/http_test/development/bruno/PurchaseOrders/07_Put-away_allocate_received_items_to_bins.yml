info:
  name: 'Put-away: allocate received items to bins'
  type: http
  seq: 7
http:
  method: POST
  url: http://localhost:8000/api/purchase-orders/1/allocate
  auth: inherit
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
          "allocated_by": 1,
          "allocations": [
              { "receipt_line_id": 1, "bin_id": 1, "item_id": 1, "quantity": 100 }
          ]
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
