info:
  name: Create a bin in Location 1
  type: http
  seq: 4
http:
  method: POST
  url: http://localhost:8000/api/locations/1/bins
  auth: inherit
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
          "bin_code": "A-01-L-01-BIN01",
          "capacity": 100,
          "created_by": 1
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
