info:
  name: Create a new supplier
  type: http
  seq: 1
http:
  method: POST
  url: http://localhost:8000/api/suppliers
  auth: inherit
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
          "name": "Swift Parts Inc.",
          "email": "contact@swiftparts.com",
          "address": "123 Supply Chain Ave, Singapore",
          "created_by": 2
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
